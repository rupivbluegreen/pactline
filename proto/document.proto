syntax = "proto3";

package pactline.document.v1;

option go_package = "github.com/rupivbluegreen/pactline/internal/document/documentgrpc;documentgrpc";

// Document sidecar service. Phase 0: Health only.
// Phase 1: Parse(binary) -> text + layout; RenderDOCX(template, vars) ->
// rendered DOCX bytes; ConvertDOCXToPDF; etc.
service Document {
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}
