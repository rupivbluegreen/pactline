[project]
name = "pactline-ai-sidecar"
version = "0.0.1"
description = "Pactline AI sidecar — gRPC server for LLM orchestration"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.66",
  "grpcio-tools>=1.66",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sidecar"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src/ai_sidecar/proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/ai_sidecar/proto/**/*.py" = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
"src/ai_sidecar/proto/**/*.pyi" = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/ai_sidecar/proto"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
